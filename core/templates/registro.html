{% extends 'base.html' %}
{% block content %}
<h2>Registro</h2>


<form method="POST">
    {% csrf_token %}

    <label>Nombre:</label>
    {{ form.username }}

    <label>Email:</label>
    {{ form.email }}

    <label>Contraseña:</label>
    {{ form.password }}

    <label>Confirmar contraseña:</label>
    {{ form.password2 }}

    <label>Rol:</label>
    {{ form.rol }}

    <button type="submit">Registrarse</button>
</form>

{% if form.errors %}
    <div style="color:red;">
        {{ form.errors }}
    </div>
{% endif %}
{% endblock %}
