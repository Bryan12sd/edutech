{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>Iniciar Sesión</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" placeholder="Usuario" required>
        <input type="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
</div>
{% endblock %}
