<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>{% block title %}EduTech{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: #f1f5f9;
        }

        /* TOP BAR - FIJA */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        /* IZQUIERDA */
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            font-size: 20px;
            cursor: pointer;
        }

        .brand {
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* DERECHA */
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        /* BOTÓN LOGOUT */
        .btn-logout {
            background: #ef4444;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        /* DRAWER */
        .drawer {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #0f172a;
            color: white;
            padding-top: 60px;
            transition: left 0.3s ease;
            z-index: 999;
        }

        .drawer.open {
            left: 0;
        }

        .drawer a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: background 0.2s;
        }

        .drawer a:hover {
            background: #334155;
        }

        .drawer-header {
            display: flex;
            align-items: center;
           margin-left: 25px    
            padding: 10px;
        }

        .logo {
            height: 45px;
            object-fit: contain;
        }

        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #f1f5f9;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #cbd5e1;
        }

        /* CONTENIDO */
        .container {
            margin-top: 60px; /* Espacio para el top bar fijo */
            padding: 25px 20px;
            transition: margin-left 0.3s ease;
        }

        .container.shift {
            margin-left: 250px;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* BOTONES */
        .btn {
            background: #2563eb;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        .btnWhite {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-logo {
            background: transparent;
        }

        /* OVERLAY para cerrar drawer al hacer click fuera */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: block;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container.shift {
                margin-left: 0;
            }

            .user-name {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeDrawer()"></div>

<!-- TOP BAR -->
<div class="topbar">
    <!-- IZQUIERDA -->
    <div class="topbar-left">
        <span class="menu-btn" onclick="toggleDrawer()">
            <i class="fas fa-bars"></i>
        </span>

        <span class="brand">
            <i class="fas fa-graduation-cap"></i> EduTech
        </span>
    </div>

    <!-- DERECHA -->
    {% if request.user.is_authenticated %}
    <div class="topbar-right">
        <span class="user-name">
            <i class="fas fa-user-circle"></i>
            {{ request.user.estudiante.nombre }}
        </span>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="btn-logout" type="submit">
                <i class="fas fa-sign-out-alt"></i>
                Salir
            </button>
        </form>
    </div>
    {% endif %}
</div>

<!-- DRAWER -->
<div id="drawer" class="drawer">
    {% load static %}

    <div class="drawer-header">
        <a href="/dashboard/" onclick="closeDrawer()">
            <img src="{% static 'image/logo.png' %}" alt="Logo" class="logo">
        </a>


    </div>

    {% if user.is_authenticated %}
    <a href="/dashboard/" onclick="closeDrawer()">Dashboard</a>
    <a href="/calificaciones/" onclick="closeDrawer()">Mis Calificaciones</a>
    <a href="/horario/" onclick="closeDrawer()">Horario</a>
    <a href="/matricula/" onclick="closeDrawer()">Matricula</a>
    <a href="/crear_curso/" onclick="closeDrawer()">Crear Curso</a>
    {% else %}
    <a href="/" onclick="closeDrawer()">Login</a>
    <a href="/registro/" onclick="closeDrawer()">Registro</a>
    {% endif %}
</div>

<!-- CONTENIDO -->
<div id="main" class="container">
    {% block content %}{% endblock %}
</div>

<script>
    function toggleDrawer() {
        const drawer = document.getElementById('drawer');
        const main = document.getElementById('main');
        const overlay = document.getElementById('overlay');

        drawer.classList.toggle('open');
        main.classList.toggle('shift');
        overlay.classList.toggle('active');

        if (drawer.classList.contains('open')) {
            localStorage.setItem('drawer', 'open');
        } else {
            localStorage.setItem('drawer', 'closed');
        }
    }

    function closeDrawer() {
        const drawer = document.getElementById('drawer');
        const main = document.getElementById('main');
        const overlay = document.getElementById('overlay');

        drawer.classList.remove('open');
        main.classList.remove('shift');
        overlay.classList.remove('active');

        localStorage.setItem('drawer', 'closed');
    }

    window.onload = function() {
        const drawer = document.getElementById('drawer');
        const main = document.getElementById('main');
        const overlay = document.getElementById('overlay');
        const estado = localStorage.getItem('drawer');

        if (estado === 'open') {
            drawer.classList.add('open');
            main.classList.add('shift');
            overlay.classList.add('active');
        }
    }
</script>

</body>
</html>
